<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#D3241C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KG Saha">
<meta name="application-name" content="KG Saha Formları">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="kg-build" content="8a4e282e08">
<title>KG Saha Formları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}

/* Layout: mobile-first single column app shell; sticky header, wizard with sticky bottom action bar. Paper replica rendered off-screen for PDF. */
:root{
  --bg:#F5F2F1; --surface:#FFFFFF; --surface-2:#FAF7F6; --fg:#1F1B1B; --muted:#6E6463; --line:#E4DCDA;
  --accent:#D3241C; --accent-fg:#FFFFFF; --accent-soft:#FBE7E5; --ok:#1E7A4C; --ok-soft:#E3F3EA; --bad:#B42318; --bad-soft:#FDECEA; --na:#8A817F;
  --shadow:0 1px 2px rgba(60,20,15,.06),0 6px 20px rgba(60,20,15,.06);
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141111; --surface:#1D1919; --surface-2:#231E1E; --fg:#F2ECEB; --muted:#A69B99; --line:#352D2C;
  --accent:#F0483E; --accent-fg:#FFFFFF; --accent-soft:#3B1D1B; --ok:#4CC38A; --ok-soft:#14301F; --bad:#FF6B5E; --bad-soft:#3A1916; --na:#8F8583;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141111; --surface:#1D1919; --surface-2:#231E1E; --fg:#F2ECEB; --muted:#A69B99; --line:#352D2C;
  --accent:#F0483E; --accent-fg:#FFFFFF; --accent-soft:#3B1D1B; --ok:#4CC38A; --ok-soft:#14301F; --bad:#FF6B5E; --bad-soft:#3A1916; --na:#8F8583;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top img{height:30px;width:auto}
@media (max-width:420px){.brand small{display:none}.top img{height:26px}.brand b{font-size:17px}}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--f-disp);font-size:19px;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{white-space:nowrap;border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 24px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.banner{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px}
.banner.warn{border-color:var(--accent);background:var(--accent-soft)}

.types{display:grid;gap:10px}
.type{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;box-shadow:var(--shadow)}
.type:hover{border-color:var(--accent)}
.type .ico{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.type b{font-family:var(--f-disp);font-size:21px;display:block}
.type span{color:var(--muted);font-size:14px}
.type .arr{color:var(--muted);font-size:22px}
.resume{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--accent);border-radius:12px;padding:14px 16px;background:var(--accent-soft)}

.btn{color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger.solid{color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* wizard */
.wz-head{display:flex;flex-direction:column;gap:10px}
.wz-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.wz-title h1{font-size:28px}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.req{color:var(--accent)}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:11px 12px;min-height:46px;font-size:16px}
.fld textarea{min-height:150px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.err .fld input,.fld.bad input{border-color:var(--bad)}
fieldset.chips{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
fieldset.chips legend{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;padding:0}
.chips>div{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:inline-flex;align-items:center;min-height:42px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-weight:600;font-size:15px;cursor:pointer}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}

.mat{display:grid;grid-template-columns:1fr 84px 40px;gap:8px;align-items:end}
.mat .x{min-height:46px;border:1px solid var(--line);border-radius:9px;background:none;cursor:pointer;color:var(--muted)}

.kl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ki{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.ki:first-child{border-top:0}
.ki .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ki .t{font-size:15px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:grid;place-items:center;width:42px;height:38px;font-weight:700;cursor:pointer;border-left:1px solid var(--line);color:var(--muted)}
.seg label:first-child span{border-left:0}
.seg input:checked+span.ok{background:var(--ok);color:#fff}
.seg input:checked+span.no{background:var(--bad);color:#fff}
.seg input:checked+span.na{background:var(--na);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.kl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted)}

.sig-wrap{display:flex;flex-direction:column;gap:8px}
.sig{position:relative;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2);height:220px;touch-action:none}
.sig canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sig .hint{position:absolute;left:0;right:0;bottom:44px;border-top:1px solid var(--muted);margin:0 24px;opacity:.5;pointer-events:none}
.sig .ph{position:absolute;left:24px;bottom:16px;font-size:13px;color:var(--muted);pointer-events:none}
.legal{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.legal p{margin:0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.bar-in .btn{flex:1}
.bar-in .btn.ghost{flex:0 0 auto}

/* preview of paper */
.pv{width:100%;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;position:relative}
.pv-in{width:794px;transform-origin:0 0;position:absolute;left:0;top:0}
.zoom{position:fixed;inset:0;z-index:80;background:#3a3a3a;display:flex;flex-direction:column}
.zoom-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);font-size:14px}
.zoom-sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;touch-action:pan-x pan-y}
.zoom-sz{position:relative}
.zoom-in{width:794px;transform-origin:0 0;position:absolute;left:0;top:0}
.zoom-in .pp{margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.4)}

/* list */
.filters{display:flex;flex-direction:column;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;min-height:46px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--f-disp);font-size:28px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.it:first-child{border-top:0}
.it:hover{background:var(--surface-2)}
.it .main{min-width:0}
.it .main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .main small{color:var(--muted);font-size:13px}
.fno{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:13px;color:var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.servis{color:#B4511A}.pill.bakim{color:var(--ok)}.pill.devreye{color:#3B5BCC}
:root:not([data-theme="light"]) .pill.devreye{color:#8FA6FF}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.done-hero{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.done-hero .badge{display:inline-flex;align-items:center;gap:8px;background:var(--ok-soft);color:var(--ok);font-weight:700;padding:6px 12px;border-radius:999px;font-size:14px}
.mailbox{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px}
.mailbox code{font-family:var(--f-mono);font-size:14px;word-break:break-all;user-select:all}
.steps-note{margin:0;padding-left:20px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;font-size:14px;max-width:calc(100% - 32px)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* ================= PAPER (fixed light colors: it is a printed sheet) ================= */
#paper-host{position:fixed;left:-12000px;top:0;width:794px;pointer-events:none}
.pp{width:794px;min-height:1123px;background:#fff;color:#1a1a1a;font-family:"Barlow",Arial,sans-serif;font-size:12.5px;line-height:1.35;padding:34px 38px 26px;display:flex;flex-direction:column;gap:8px}
.pp *{box-sizing:border-box}
.pp-head{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:10px;margin-bottom:4px}
.pp-head img{width:140px;height:auto}
.pp-title{text-align:center;font-family:"Barlow Condensed","Barlow",Arial,sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.1;white-space:pre-line}
.pp-no{margin-top:6px;font-family:"IBM Plex Mono",monospace;color:#C8211A;font-size:20px;font-weight:600;letter-spacing:.04em}
.pp-meta{text-align:right;font-size:11px;color:#555}
.pp-sec{background:#9a9a9a;color:#111;font-weight:700;text-align:center;font-size:12.5px;letter-spacing:.05em;padding:3px 0;border:1px solid #333}
.pp-t{width:100%;border-collapse:collapse}
.pp-t td{border:1px solid #333;padding:5px 7px;vertical-align:top}
.pp-t td.l{font-weight:700;white-space:nowrap;width:1%;background:#f2f2f2}
.pp-box{border:1px solid #333;padding:8px 10px;white-space:pre-wrap;min-height:120px}
.pp-grow{flex:1}
.cb{display:inline-block;width:12px;height:12px;border:1.3px solid #222;position:relative;vertical-align:-1px;margin-right:4px;background:#fff}
.cb.on::after{content:"";position:absolute;left:3px;top:-1px;width:4px;height:8px;border:solid #C8211A;border-width:0 2px 2px 0;transform:rotate(45deg)}
.pp-opts{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}
.pp-k{width:100%;border-collapse:collapse;font-size:11.5px}
.pp-k td{border:1px solid #333;padding:3px 6px}
.pp-k td.m{width:28px;text-align:center;font-weight:700}
.mk-ok{color:#1E7A4C}.mk-no{color:#C8211A}.mk-na{color:#777}
.pp-legal{font-size:11.2px;display:flex;flex-direction:column;gap:6px}
.pp-legal p{margin:0}
.pp-sign{width:100%;border-collapse:collapse}
.pp-sign td{border:1px solid #333;padding:5px 7px;vertical-align:top;width:50%}
.pp-sign .who{font-weight:700}
.pp-sign img{display:block;max-height:64px;max-width:220px;margin-top:4px}
.pp-sign .sigline{height:68px}
.pp-foot{display:grid;grid-template-columns:1fr 1.6fr;border:1px solid #333}
.pp-foot>div{padding:6px 8px}
.pp-foot>div+div{border-left:1px solid #333;font-size:10.8px}
.pp-photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.pp-photos figure{margin:0;border:1px solid #333;padding:6px}
.pp-photos .ph{height:380px;display:flex;align-items:center;justify-content:center;background:#f3f3f3}
.pp-photos .ph img{max-width:100%;max-height:100%}
.pp-photos figcaption{font-size:11.5px;margin-top:5px;min-height:16px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.foto{position:relative;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface-2);min-width:0}
.foto img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.foto input{border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:14px;background:var(--surface);min-width:0;width:100%}
.foto .fx{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.pp-foot .h{background:#9a9a9a;font-weight:700;text-align:center;margin:-6px -8px 6px;padding:2px;border-bottom:1px solid #333}

.li{border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .it{border-top:0;grid-template-columns:1fr auto}
.it .main .pill{margin-bottom:4px;font-size:10px}
.li.open{background:var(--surface-2)}
.li-body{padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv span{color:var(--muted)}.kv b{font-weight:500;min-width:0;overflow-wrap:anywhere}
.ms.ok{color:var(--ok);font-weight:600}.ms.bad{color:var(--bad);font-weight:600}.ms.na{color:var(--muted)}
.fld select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:11px 12px;min-height:46px;font-size:16px}
.who-line{display:flex;align-items:center;gap:8px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.ro{display:flex;flex-direction:column;gap:5px}.ro span{font-size:13px;font-weight:600;color:var(--muted)}.ro b{font-size:17px}

/* ===== PDF v2 ===== */
.pp{padding:0;gap:0;font-size:12.2px;color:#1d1d1f}
.pp-band{height:7px;background:#C8211A;flex:none}
.pp-body{padding:20px 36px 8px;display:flex;flex-direction:column;gap:9px;flex:1}
.pp-head{grid-template-columns:150px 1fr 170px;margin-bottom:2px;padding-bottom:10px;border-bottom:1.5px solid #1d1d1f}
.pp-head img{width:132px}
.pp-title{font-size:23px;letter-spacing:.03em}
.pp-no{font-size:18px;margin-top:4px}
.pp-meta{font-size:10.5px;color:#444;line-height:1.5}
.pp-meta b{display:block;font-size:9px;letter-spacing:.1em;color:#888;font-weight:600}
.pp-sec{background:#2B2B2E;color:#fff;text-align:left;font-size:10.5px;letter-spacing:.14em;padding:4px 10px;border:0;border-left:4px solid #C8211A}
.pp-t td{border:1px solid #CFCFCF;padding:5px 8px}
.pp-t td.l{background:#F6F2F1;color:#3a3a3a;font-weight:600;font-size:11.3px}
.pp-box{border:1px solid #CFCFCF;border-radius:2px;line-height:1.45}
.pp-k td{border:1px solid #D9D9D9;padding:3px 7px}
.pp-k tr:nth-child(even) td{background:#FAF7F7}
.pp-k{font-size:10.6px}
.pp-k td{padding:2px 6px;line-height:1.25}
.pp-sign td{border:1px solid #CFCFCF;padding:7px 9px}
.pp-sign .sigbox{height:66px;display:flex;align-items:center;justify-content:center;border-bottom:1px dashed #BBB;margin-top:6px}
.pp-sign .sigbox img{max-height:62px;max-width:230px;margin:0}
.pp-sign .ts{font-size:9.6px;color:#666;margin-top:3px}
.pp-sign .onay{font-size:10px;color:#333;font-style:italic;margin-top:3px}
.pp-foot{border:1px solid #CFCFCF}
.pp-foot>div+div{border-left:1px solid #CFCFCF}
.pp-foot .h{background:#2B2B2E;color:#fff;border:0;letter-spacing:.12em;font-size:10px}
.pp-pf{display:flex;justify-content:space-between;gap:16px;padding:7px 36px 12px;font-size:9.2px;color:#777;border-top:1px solid #E2E2E2;flex:none}
.pp-pf b{color:#333;font-family:"IBM Plex Mono",monospace;font-weight:600}
.pp-terms{display:flex;flex-direction:column;gap:12px;font-size:11.4px;line-height:1.5}
.pp-terms h3{margin:0 0 4px;font-size:12px;letter-spacing:.06em}
.pp-terms ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.pp-terms p{margin:0}
.pp-terms .box{border:1px solid #CFCFCF;padding:10px 12px;border-radius:2px}
/* UI */
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--fg);text-align:left}
.quick button:hover{border-color:var(--accent)}
.steplbl{font-size:14px;color:var(--muted)}
.steplbl b{color:var(--fg);font-weight:600}
.consent{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:15px}
.consent input{width:24px;height:24px;flex:none;accent-color:var(--accent);margin-top:1px}
.bad.consent{border-color:var(--bad)}
details.kvkk{font-size:13px;color:var(--muted)}
details.kvkk summary{cursor:pointer;font-weight:600}
details.kvkk p{margin:8px 0 0;line-height:1.5}
.sigtime{font-size:12px;color:var(--ok);font-weight:600}
@media (max-width:560px){.sig{height:240px}}

/* kurulum uyarısı */
.inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:14px;line-height:1.4}
.inst img{width:44px;height:44px;border-radius:10px;flex:none}
.inst b{display:block;font-size:15px}
.inst button{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:9px 12px;font-weight:600;cursor:pointer;flex:none}
.inst .x{background:none;color:inherit;opacity:.7;padding:4px 6px;font-size:18px}
</style>
</head>

function afterWizard(){

function setupSig(cv){
  const k=cv.dataset.sig,box=cv.parentElement,dpr=Math.max(1,window.devicePixelRatio||1);
  const r=box.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;
  const ctx=cv.getContext("2d");ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=getComputedStyle(document.body).color;ctx.lineWidth=2.6*dpr;
  if(F[k]){const im=new Image();im.onload=()=>{const s=Math.min(cv.width*.9/im.width,cv.height*.8/im.height,1.5*dpr);ctx.drawImage(im,(cv.width-im.width*s)/2,(cv.height-im.height*s)/2-10*dpr,im.width*s,im.height*s)};im.src=F[k];box.querySelector(".ph").hidden=true}
  let drawing=false,last=null,dirty=false;
  const pos=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*dpr,(e.clientY-b.top)*dpr]};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pos(e);ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill();box.querySelector(".ph").hidden=true;dirty=true});
  cv.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);const pr=e.pressure&&e.pointerType==="pen"?.6+e.pressure:1;ctx.lineWidth=2.6*dpr*pr;ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p});
  const end=()=>{if(!drawing)return;drawing=false;if(dirty){F[k]=exportSig(cv);F[k+"At"]=new Date().toISOString();saveDraft();delete S.errs[k];const st=$("#sigst-"+k);if(st){st.textContent="İmza alındı · "+fmtTs(F[k+"At"]);st.className="sigtime"}}};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);cv.addEventListener("pointerleave",end);
}
function exportSig(cv){
  const ctx=cv.getContext("2d"),{width:w,height:h}=cv,d=ctx.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){if(d[(y*w+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<=x0)return"";
  const m=8;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(w,x1+m);y1=Math.min(h,y1+m);
  const sw=x1-x0,sh=y1-y0,sc=Math.min(1,500/sw,200/sh);
  const o=document.createElement("canvas");o.width=Math.round(sw*sc);o.height=Math.round(sh*sc);
  const oc=o.getContext("2d");oc.drawImage(cv,x0,y0,sw,sh,0,0,o.width,o.height);
  // recolor to dark ink so it reads on white paper in both themes
  const id=oc.getImageData(0,0,o.width,o.height);for(let i=0;i<id.data.length;i+=4){id.data[i]=20;id.data[i+1]=40;id.data[i+2]=120}oc.putImageData(id,0,0);
  return o.toDataURL("image/png");
}

async function snap(html){
  const host=$("#paper-host");host.innerHTML=html;
  await Promise.all([...host.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  try{await document.fonts.ready}catch(e){}
  const c=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:"#ffffff",logging:false});
  host.innerHTML="";return c;
}
function addCanvas(pdf,canvas,first){
  const pw=210,pagePx=Math.floor(canvas.width*297/pw);
  if(canvas.height<=pagePx*1.45){ // tek sayfaya sığdır
    const sc=Math.min(1,pagePx/canvas.height),w=pw*sc,h=canvas.height*pw/canvas.width*sc;
    if(!first)pdf.addPage();
    pdf.addImage(canvas.toDataURL("image/jpeg",.88),"JPEG",(pw-w)/2,0,w,h);
  }else for(let y=0,i=0;y<canvas.height-20;y+=pagePx,i++){
    const h=Math.min(pagePx,canvas.height-y),c=document.createElement("canvas");c.width=canvas.width;c.height=h;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,h);x.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
    if(i||!first)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.88),"JPEG",0,0,pw,h*pw/canvas.width);
  }
}

async function makePdf(f){
  if(!window.html2canvas||!window.jspdf)throw new Error("PDF araçları yüklenemedi");
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
  const fs=f.fotolar||[],hasTerms=!!(termsList(f.type).length||TX.kvkk||TX.eimza),total=1+Math.ceil(fs.length/4)+(hasTerms?1:0);let n=1;

function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();

    c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.72))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Fotoğraf okunamadı"))};img.src=url})}

function newForm(type){
  F={type,tarih:today(),varis:nowHM(),ayrilis:"",personel:S.sess.name,ulasim:"Servis Aracı",plaka:store.get("kg-plaka")||"",
     firma:"",ilgili:"",adres:"",ilce:"",tel:"",email:"",
     servisTuru:type==="devreye"?"Devreye Alma":"",isEmri:"",santral:"",seriNo:"",proje:"",yapilan:"",malzeme:[{ad:"",adet:""}],
     v:3,kontrol:{},fotolar:[],garanti:"",sozlesme:"",aciklama:"",calisma:"",gecikme:true,saniye:"60",yetkili:"",sigP:"",sigM:"",step:0};
  S.step=0;S.errs={};saveDraft();go("wizard");
}
let draftT;
function saveDraft(){clearTimeout(draftT);draftT=setTimeout(saveDraftNow,300)}
function saveDraftNow(){if(F){F.step=S.step;store.set("kg-draft",F)}}
function clearDraft(){clearTimeout(draftT);store.del("kg-draft")}

function customers(){const m=new Map();for(const c of S.customers){const k=(c.firma||"").trim().toLocaleLowerCase("tr");if(k&&!m.has(k))m.set(k,c)}return m}
function buildDatalist(){$("#dl-firma").innerHTML=[...customers().values()].map(c=>`<option value="${esc(c.firma)}">`).join("")}

/* ---------- login ---------- */
async function boot(){
  TX=store.get("kg-texts")||{};
  setHeader();
  if(S.sess){
    S.view="checking";render();
    try{const r=await api("login",S.sess.name,S.sess.pin);S.sess.role=r.role;store.set("kg-sess",S.sess);return afterLogin()}
    catch(e){if(/PIN|Oturum|deneme/.test(errMsg(e))){S.sess=null;store.del("kg-sess")}else{S.loginErr=errMsg(e)}}
  }
  S.view="login";render();
  try{S.staff=await api("getStaffNames")}catch(e){S.loginErr=errMsg(e);S.staff=[]}
  render();
}
function afterLogin(){
  setHeader();go("home");
  api("getCustomers",S.sess).then(c=>{S.customers=c||[];buildDatalist()}).catch(()=>{});
  api("getTexts",S.sess).then(t=>{if(t){TX=t;store.set("kg-texts",t)}}).catch(()=>{});
}
function setHeader(){
  const on=!!S.sess&&S.view!=="login";
  $("#nav").hidden=!S.sess;
  $("#who").textContent=S.sess?S.sess.name+(isAdmin()&&S.sess.name!=="Yönetici"?" · Yönetici":""):"Giriş yapın";
  $("#nav-list").textContent=isAdmin()?"Formlar":"Formlarım";
}
function loginV(){
  const names=S.staff;
  return`<div class="stack" style="max-width:420px;margin:24px auto 0">
    <div><div class="eyebrow">Kırmızı Group</div><h1 style="font-size:32px;margin-top:4px">Personel girişi</h1></div>
    ${S.loginErr?`<div class="banner warn">${esc(S.loginErr)}</div>`:""}
    <form class="card" id="login" autocomplete="off">
      <label class="fld"><span>Adınız</span>
        <select id="l-name" required>${names===null?`<option>Yükleniyor…</option>`:`<option value="">Seçin</option>${names.map(n=>`<option ${(S.lname||store.get("kg-last"))===n?"selected":""}>${esc(n)}</option>`).join("")}`}</select></label>
      <label class="fld"><span>PIN</span><input id="l-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" required></label>
      <button class="btn primary" type="submit" ${S.busy||names===null?"disabled":""}>${S.busy?'<span class="spin"></span> Kontrol ediliyor':"Giriş yap"}</button>
    </form>
    <p class="muted" style="font-size:13px;margin:0">PIN'inizi bilmiyorsanız yöneticinize sorun.</p></div>`;
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="login")return;e.preventDefault();
  const name=$("#l-name").value,pin=$("#l-pin").value.trim();S.lname=name;
  if(!name||!pin){S.loginErr="Adınızı seçip PIN'inizi girin.";return render()}
  S.busy=true;S.loginErr="";render();
  try{const r=await api("login",name,pin);S.sess={name:r.name,pin,role:r.role};store.set("kg-sess",S.sess);store.set("kg-last",r.name);S.busy=false;afterLogin()}
  catch(err){S.busy=false;S.loginErr=errMsg(err);render()}
});

/* ---------- navigation & render ---------- */
function go(v){
  S.view=v;
  document.querySelectorAll("[data-nav]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.nav===v||(["wizard","done"].includes(v)&&b.dataset.nav==="home"))));
  setHeader();render();window.scrollTo(0,0);
  if(v==="list"&&S.forms===null)loadForms();
}
let rendering=false;
function render(){
  if(rendering){setTimeout(render,0);return}rendering=true;try{render_()}finally{rendering=false}
}
function render_(){
  const m=$("#main"),bar=$("#bar");bar.innerHTML="";
  if(S.view==="checking")m.innerHTML=`<div class="stack" style="align-items:center;padding:60px 0"><span class="spin" style="width:28px;height:28px;color:var(--accent)"></span></div>`;
  else if(S.view==="login")m.innerHTML=loginV();
  else if(S.view==="home")m.innerHTML=homeV();
  else if(S.view==="wizard"){m.innerHTML=wizardV();bar.innerHTML=barV();afterWizard()}
  else if(S.view==="done")m.innerHTML=doneV();
  else if(S.view==="list")m.innerHTML=listV();
}
function homeV(){
  const d=store.get("kg-draft");
  return`<div class="stack">
  ${d&&d.type?`<div class="resume"><div><b>${d.no?"Gönderilmemiş form":"Yarım kalan form"}</b><div class="muted" style="font-size:14px">${esc(TYPES[d.type].name)}${d.no?" № "+pad(d.no):""}${d.firma?" · "+esc(d.firma):""}</div></div>
     <div class="row">${d.no?"":`<button class="btn sm ghost" data-act="dropDraft">Sil</button>`}<button class="btn sm primary" data-act="resume">Devam et</button></div></div>`:""}
  <div><div class="eyebrow">Yeni form</div><h1 style="font-size:30px;margin-top:4px">Hangi işi yaptınız?</h1></div>
  <div class="types">${Object.entries(TYPES).map(([k,t])=>`<button class="type" data-act="new" data-type="${k}"><span class="ico">${t.icon}</span><span><b>${t.name}</b><span>${t.desc}</span></span><span class="arr">›</span></button>`).join("")}</div>
  <p class="muted" style="font-size:13px;margin:0">Form tamamlanınca PDF olarak form@kirmizigroup.com adresinden müşteriye gönderilir ve şirket arşivine kaydedilir.</p>
  </div>`;
}

/* ---------- finish: number → PDF → Drive + Gmail ---------- */
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function finish(){
  S.view="done";S.saving=true;S.saveErr="";S.result=null;S.phase="Form numarası alınıyor";render();window.scrollTo(0,0);
  try{
    if(!F.no){F.no=await api("reserveNumber",S.sess,F.type);saveDraftNow()}
    if(!F.kod){F.kod=newCode();F.cihaz=deviceName();saveDraftNow()}
    S.phase="PDF hazırlanıyor";render();
    const b64=await blobToB64(await makePdf(F));
    S.phase=F.email?"Müşteriye gönderiliyor":"Arşive kaydediliyor";render();
    const data=JSON.parse(JSON.stringify(F));data.fotoSayisi=(F.fotolar||[]).length;delete data.fotolar;delete data.sigP;delete data.sigM;delete data.step;
    data.malzeme=(data.malzeme||[]).filter(m=>m.ad);
    const r=await api("submitForm",S.sess,data,b64,fileName(F));
    S.result={...r,type:F.type,no:F.no,firma:F.firma,tarih:F.tarih};
    clearDraft();F=null;S.forms=null;
    if(data.firma&&!customers().has(data.firma.trim().toLocaleLowerCase("tr")))S.customers.unshift({firma:data.firma,ilgili:data.ilgili,adres:data.adres,ilce:data.ilce,tel:data.tel,email:data.email}),buildDatalist();
  }catch(e){S.saveErr=errMsg(e)}
  S.saving=false;render();
}
function doneV(){
  if(S.saving)return`<div class="stack" style="align-items:center;padding:60px 0;text-align:center"><span class="spin" style="width:32px;height:32px;color:var(--accent)"></span><h2>${esc(S.phase)}…</h2><p class="muted">Lütfen sayfayı kapatmayın.</p></div>`;
  if(S.saveErr)return`<div class="stack"><div class="banner warn"><b>Form gönderilemedi.</b><br>${esc(S.saveErr)}</div>
    <p class="muted" style="margin:0">Form telefonda saklanıyor${F&&F.no?` (№ ${pad(F.no)})`:""}. İnternet bağlantısı gelince tekrar deneyin.</p>
    <div class="row"><button class="btn primary" data-act="retry">Tekrar dene</button><button class="btn" data-act="home">Ana sayfa</button></div></div>`;
  const r=S.result;
  const mailLine=r.mailOk?`<div class="banner"><b>Müşteriye gönderildi:</b> ${esc(r.mailTo)}<br><span class="muted">Mail form@kirmizigroup.com adresinden PDF ekiyle gitti. Kopyası o hesabın Gönderilmiş kutusunda.</span></div>`
    :r.mailTo?`<div class="banner warn"><b>Form kaydedildi ama mail gönderilemedi.</b><br>${esc(r.mailDurum)}<br>Yönetici “Formlar” bölümünden tekrar gönderebilir.</div>`
    :`<div class="banner warn"><b>Müşteri e-postası girilmediği için müşteriye mail gitmedi.</b><br>Form arşive kaydedildi ve form@ kutusuna kopyası gönderildi.</div>`;
  return`<div class="stack">
    <div class="done-hero"><span class="badge">✓ Form kaydedildi</span><h1 style="font-size:30px">${esc(TYPES[r.type].name)} <span class="fno" style="font-size:22px">№ ${pad(r.no)}</span></h1><p class="muted" style="margin:0">${esc(r.firma)} · ${trDate(r.tarih)}</p></div>
    ${mailLine}
    ${r.pdfUrl?`<div><a class="btn" href="${esc(r.pdfUrl)}" target="_blank" rel="noopener">PDF'i Drive'da aç</a></div>`:""}
    <button class="btn primary" data-act="home">Yeni form</button></div>`;
}

/* ---------- list ---------- */
async function loadForms(){
  S.forms=null;S.formsErr="";render();
  try{S.forms=await api("listForms",S.sess)}catch(e){S.formsErr=errMsg(e);S.forms=[]}
  if(S.view==="list")render();
}
const mailState=f=>/^Gönderildi/.test(f.mail)?["ok","Gönderildi"]:/^HATA/.test(f.mail)?["bad","Mail hatası"]:/yok/.test(f.mail)?["na","E-posta yok"]:["na",f.mail||"—"];
function itemV(f){
  const [cls,lbl]=mailState(f),open=S.open===f.id;
  return`<div class="li ${open?"open":""}"><button class="it" data-act="toggle" data-id="${esc(f.id)}" aria-expanded="${open}"><span class="main"><span class="pill ${esc(f.type)}">${esc(TYPES[f.type]?.short||f.type)}</span><b>${esc(f.firma||"—")}</b><small>${trDate(f.tarih)} · ${esc(f.personel)} · <span class="ms ${cls}">${esc(lbl)}</span></small></span><span class="fno">№ ${pad(f.no)}</span></button>
  ${open?`<div class="li-body">
    <div class="kv"><span>Müşteri yetkilisi</span><b>${esc(f.yetkili||"—")}</b><span>Kayıt</span><b>${esc(f.zaman)}</b><span>Mail durumu</span><b>${esc(f.mail||"—")}</b></div>
    ${f.pdfUrl?`<div class="row"><a class="btn sm" href="${esc(f.pdfUrl)}" target="_blank" rel="noopener">PDF'i Drive'da aç</a></div>`:""}
    ${isAdmin()?`<div class="row" style="align-items:flex-end"><label class="fld" style="flex:1;min-width:200px"><span>Maili (tekrar) gönder</span><input id="rs-${esc(f.id)}" type="email" inputmode="email" value="${esc(S.resend[f.id]??f.email)}" placeholder="musteri@firma.com"></label><button class="btn sm primary" data-act="resend" data-id="${esc(f.id)}">Gönder</button></div>`:""}
  </div>`:""}</div>`;
}
function filtered(){
  const q=S.filter.q.trim().toLocaleLowerCase("tr");
  return(S.forms||[]).filter(f=>(S.filter.type==="all"||f.type===S.filter.type)&&(!q||[f.firma,f.personel,f.yetkili,pad(f.no),f.email].join(" ").toLocaleLowerCase("tr").includes(q)));
}
function listItems(){
  const arr=filtered();
  return arr.length?`<div class="list">${arr.map(itemV).join("")}</div>`:`<div class="empty">${(S.forms||[]).length?"Aramaya uyan form yok.":"Henüz form yok. İlk formu “Yeni form” bölümünden oluşturun."}</div>`;
}
function listV(){
  const head=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${isAdmin()?"Yönetici paneli":"Kayıtlar"}</div><h1 style="font-size:30px;margin-top:4px">${isAdmin()?"Tüm formlar":"Formlarım"}</h1></div><button class="btn sm" data-act="reload">Yenile</button></div>`;
  if(S.forms===null)return`<div class="stack">${head}<div class="banner"><span class="spin" style="vertical-align:-3px"></span>&nbsp; Formlar yükleniyor…</div></div>`;
  const v=S.forms,ym=today().slice(0,7),cnt=t=>v.filter(f=>f.type===t&&(f.tarih||"").startsWith(ym)).length;
  return`<div class="stack">${head}
    ${S.formsErr?`<div class="banner warn">${esc(S.formsErr)}</div>`:""}
    <div><div class="eyebrow" style="margin-bottom:6px">Bu ay</div><div class="stats">${Object.entries(TYPES).map(([k,t])=>`<div class="stat"><b>${cnt(k)}</b><span>${t.short}</span></div>`).join("")}</div></div>
    <div class="filters"><input class="search" id="q" type="search" placeholder="Firma, personel, form no ara" value="${esc(S.filter.q)}" aria-label="Formlarda ara">
    <div class="chips"><div>${[["all","Tümü"],...Object.entries(TYPES).map(([k,t])=>[k,t.short])].map(([k,l])=>`<label class="chip"><input type="radio" name="ft" ${S.filter.type===k?"checked":""} data-act="ftype" data-type="${k}"><span>${l} · ${k==="all"?v.length:v.filter(f=>f.type===k).length}</span></label>`).join("")}</div></div></div>
    <div id="listbox">${listItems()}</div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.filter.q=t.value;const l=$("#listbox");if(l)l.innerHTML=listItems();return}
  if(t.id&&t.id.startsWith("rs-")){S.resend[t.id.slice(3)]=t.value;return}
  if(!F||S.view!=="wizard")return;
  if(t.dataset.f){F[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;delete S.errs[t.dataset.f];saveDraft()}
  else if(t.dataset.m){const[i,k]=t.dataset.m.split(".");F.malzeme[+i][k]=t.value;saveDraft()}
  else if(t.dataset.fn!==undefined&&F.fotolar){F.fotolar[+t.dataset.fn].not=t.value;saveDraft()}
});
document.addEventListener("change",e=>{
  const t=e.target;if(!F||S.view!=="wizard")return;
  if(t.id==="fotoIn"){addFotos(t.files);return}
  if(t.dataset.f){F[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;saveDraft();
    if(t.dataset.f==="firma"){const c=customers().get(t.value.trim().toLocaleLowerCase("tr"));if(c){let ch=0;for(const k of["ilgili","adres","ilce","tel","email","santral","seriNo"])if(!F[k]&&c[k]){F[k]=c[k];ch=1}if(ch)setTimeout(render,0)}}}
  if(t.dataset.k!==undefined){F.kontrol[t.dataset.k]=t.value;saveDraft();const c=$("#kcount");if(c)c.textContent=`${Object.keys(F.kontrol).length} / ${KONTROL.length} işaretlendi`}
});
document.addEventListener("click",async e=>{
  const n=e.target.closest("[data-nav]");if(n){if(S.view==="wizard")saveDraftNow();return go(n.dataset.nav)}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="new")newForm(b.dataset.type);
  else if(a==="resume"){F=store.get("kg-draft");if(!F)return;S.step=Math.min(F.step||0,STEPS[F.type].length-1);if(F.v!==3){S.step=Math.min(S.step,STEPS[F.type].indexOf("imzaP"));F.v=3}S.errs={};
    if(F.no&&F.sigP&&F.sigM){go("wizard");finish()}else go("wizard")}
  else if(a==="dropDraft"){clearDraft();render()}
  else if(a==="next"){if(!validate())return render();if(STEPS[F.type][S.step]==="ziyaret")store.set("kg-plaka",F.plaka);
    S.step++;if(STEPS[F.type][S.step]==="imzaP"&&!F.ayrilis)F.ayrilis=nowHM();saveDraftNow();render();window.scrollTo(0,0)}
  else if(a==="back"){S.errs={};S.step--;saveDraftNow();render();window.scrollTo(0,0)}
  else if(a==="cancel"){saveDraftNow();go("home")}
  else if(a==="addMat"){F.malzeme.push({ad:"",adet:""});render();$("#m-"+(F.malzeme.length-1)+"-ad")?.focus()}
  else if(a==="delMat"){F.malzeme.splice(+b.dataset.i,1);if(!F.malzeme.length)F.malzeme.push({ad:"",adet:""});saveDraft();render()}
  else if(a==="allOk"){KONTROL.forEach((_,i)=>{if(!F.kontrol[i])F.kontrol[i]="ok"});saveDraft();render()}
  else if(a==="quick"){const k=b.dataset.k,q=QUICK[k][+b.dataset.i];F[k]=(F[k]||"").trim()?(F[k].replace(/\s+$/,"")+(k==="yapilan"?"\n":" ")+q):q;saveDraftNow();const ta=$("#f-"+k);if(ta){ta.value=F[k];ta.focus()}}
  else if(a==="delFoto"){F.fotolar.splice(+b.dataset.i,1);saveDraftNow();render()}
  else if(a==="zoom"){S.zoom=1;document.body.insertAdjacentHTML("beforeend",zoomV());zoomApply();document.body.style.overflow="hidden"}
  else if(a==="zoomClose"){$("#zoom")?.remove();document.body.style.overflow=""}
  else if(a==="zoomIn"){S.zoom=Math.min(2.5,(S.zoom||1)+.25);zoomApply()}
  else if(a==="zoomOut"){S.zoom=Math.max(.6,(S.zoom||1)-.25);zoomApply()}
  else if(a==="clearSig"){F[b.dataset.k]="";F[b.dataset.k+"At"]="";saveDraft();render()}
  else if(a==="finish"){if(!validate())return render();saveDraftNow();finish()}
  else if(a==="retry"){if(!F)F=store.get("kg-draft");if(F)finish();else go("home")}
  else if(a==="home"){if(S.saveErr&&F)saveDraftNow();S.saveErr="";F=null;go("home")}
  else if(a==="toggle"){S.open=S.open===b.dataset.id?null:b.dataset.id;const l=$("#listbox");if(l)l.innerHTML=listItems()}
  else if(a==="ftype"){S.filter.type=b.dataset.type;const l=$("#listbox");if(l)l.innerHTML=listItems()}
  else if(a==="reload")loadForms();
  else if(a==="logout"){store.del("kg-sess");S.sess=null;S.forms=null;S.customers=[];setHeader();boot()}
  else if(a==="resend"){
    const id=b.dataset.id,email=($("#rs-"+id)?.value||"").trim();
    if(!/^\S+@\S+\.\S+$/.test(email)){toast("Geçerli bir e-posta adresi yazın");return}
    const old=b.innerHTML;b.disabled=true;b.innerHTML='<span class="spin"></span>';
    try{const r=await api("resendMail",S.sess,id,email);toast(r.ok?"Mail gönderildi":"Gönderilemedi: "+r.durum);
      const f=S.forms.find(x=>x.id===id);if(f){f.mail=r.durum;if(r.ok)f.email=email}const l=$("#listbox");if(l)l.innerHTML=listItems()}
    catch(err){toast(errMsg(err));b.disabled=false;b.innerHTML=old}
  }
});
boot();
/* ---------- telefona kurulum ---------- */
(function(){
  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
  if(standalone)return;
  let dismissed=false;try{dismissed=sessionStorage.getItem("kg-inst")==="1"}catch(e){}
  if(dismissed)return;
  const ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua),isAndroid=/Android/.test(ua);
  let deferred=null;
  function show(html){const d=document.createElement("div");d.className="inst";d.innerHTML=`<img src="icon-192.png" alt=""><div style="flex:1;min-width:0">${html}</div><button class="x" aria-label="Kapat">✕</button>`;document.body.appendChild(d);
    d.querySelector(".x").onclick=()=>{d.remove();try{sessionStorage.setItem("kg-inst","1")}catch(e){}};return d}
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;
    const d=show(`<b>Uygulamayı telefona kur</b>Ana ekrana eklenir, tam ekran açılır.`);
    const b=document.createElement("button");b.textContent="Kur";d.insertBefore(b,d.querySelector(".x"));
    b.onclick=async()=>{if(!deferred)return;deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==="accepted")d.remove()}});
  if(isIOS){show(`<b>Uygulamayı telefona kur</b>Safari'de adres çubuğundaki <b>≡</b> (veya <b>Paylaş</b> kare-ok) simgesine, sonra <b>Ana Ekrana Ekle</b>'ye dokunun.`)}
  else if(isAndroid){setTimeout(()=>{if(!deferred&&!document.querySelector(".inst"))show(`<b>Uygulamayı telefona kur</b>Chrome menüsünden (⋮) <b>Ana ekrana ekle</b> / <b>Uygulamayı yükle</b>'ye dokunun.`)},3000)}
})();
